name: CDC selection checks

on:
  push:
    branches: [main, phase1-cdc-reliability-2026-11-17]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Test CDC selection rules
        run: Rscript tests/test_cdc_selection.R
